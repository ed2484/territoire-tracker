name: Veille territoriale

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 06:00 UTC (~08:00 heure française)
  workflow_dispatch: {}   # permet aussi de lancer manuellement depuis l'onglet "Actions"

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests feedparser

      - name: Lancer la collecte
        run: python veille.py

      - name: Committer le résultat s'il a changé
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.json
          git diff --quiet --cached || git commit -m "Veille du $(date -u +%Y-%m-%d)"
          git push
